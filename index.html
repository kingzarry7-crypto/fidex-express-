<script>
const API_BASE = "";

const STEPS = [
    "Registered",
    "Picked Up",
    "Departed Origin",
    "In Transit",
    "Arrived at Destination",
    "Out for Delivery",
    "Delivered"
];

const FALLBACK_COORDS = {
    "NIGERIA": [9.0820, 8.6753],
    "LAGOS": [6.5244, 3.3792],
    "ABUJA": [9.0765, 7.3986],
    "LONDON": [51.5074, -0.1278],
    "UK": [55.3781, -3.4360],
    "UNITED KINGDOM": [55.3781, -3.4360],
    "NEW YORK": [40.7128, -74.0060],
    "USA": [37.0902, -95.7129],
    "UNITED STATES": [37.0902, -95.7129]
};

let leafletMap = null;
let mapMarkers = [];
let packageData = null;
let movingMarker = null;
let animationTimer = null;

let localPackages =
    JSON.parse(localStorage.getItem("fidex_packages") || "{}");


// =====================================================
// BASIC HELPERS
// =====================================================

function escapeHtml(value) {
    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function getAuthHeaders() {
    return {
        "Content-Type": "application/json",
        "X-Admin-Email":
            localStorage.getItem("adminEmail") || "",
        "X-Admin-Password":
            localStorage.getItem("adminPassword") || ""
    };
}


function showError(message) {
    const box =
        document.getElementById("errorMessage");

    box.innerText = message;
    box.classList.remove("hidden");
}


function hideError() {
    document
        .getElementById("errorMessage")
        .classList.add("hidden");
}


// =====================================================
// ADMIN MODAL
// =====================================================

function toggleAdminModal() {
    const modal =
        document.getElementById("adminModal");

    modal.classList.toggle("hidden");

    if (!modal.classList.contains("hidden")) {
        checkAdminSession();
    }
}


// =====================================================
// REAL BACKEND ADMIN LOGIN
// =====================================================

async function handleAdminLogin() {

    const email =
        document
            .getElementById("adminEmailInput")
            .value
            .trim();

    const password =
        document
            .getElementById("adminPasswordInput")
            .value;

    const errorBox =
        document.getElementById("adminAuthError");


    errorBox.classList.add("hidden");


    if (!email || !password) {

        errorBox.innerText =
            "Enter your admin email and password.";

        errorBox.classList.remove("hidden");

        return;
    }


    try {

        const response =
            await fetch(
                `${API_BASE}/api/admin/login`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "X-Admin-Email":
                            email,

                        "X-Admin-Password":
                            password
                    },

                    cache: "no-store"
                }
            );


        const data =
            await response
                .json()
                .catch(() => ({}));


        if (!response.ok) {

            let error =
                data.detail ||
                data.message ||
                "Invalid admin credentials.";

            if (Array.isArray(error)) {
                error = error
                    .map(x =>
                        x.msg ||
                        x.message ||
                        JSON.stringify(x)
                    )
                    .join(", ");
            }

            if (typeof error === "object") {
                error =
                    error.message ||
                    JSON.stringify(error);
            }

            throw new Error(error);
        }


        localStorage.setItem(
            "adminEmail",
            email
        );

        localStorage.setItem(
            "adminPassword",
            password
        );


        document
            .getElementById("adminLoginFormView")
            .classList.add("hidden");

        document
            .getElementById("adminPanelView")
            .classList.remove("hidden");


        await loadAdminPackages();


    } catch (error) {

        console.error(
            "Admin login error:",
            error
        );

        errorBox.innerText =
            error.message ||
            "Unable to connect to the server.";

        errorBox.classList.remove("hidden");
    }
}


// =====================================================
// CHECK SAVED LOGIN
// =====================================================

function checkAdminSession() {

    const email =
        localStorage.getItem("adminEmail");

    const password =
        localStorage.getItem("adminPassword");


    if (email && password) {

        document
            .getElementById("adminEmailInput")
            .value = email;

        document
            .getElementById("adminPasswordInput")
            .value = password;

        document
            .getElementById("adminLoginFormView")
            .classList.add("hidden");

        document
            .getElementById("adminPanelView")
            .classList.remove("hidden");

        loadAdminPackages();
    }
}


// =====================================================
// ADMIN LOGOUT
// =====================================================

function handleAdminLogout() {

    localStorage.removeItem("adminEmail");
    localStorage.removeItem("adminPassword");

    document
        .getElementById("adminEmailInput")
        .value = "";

    document
        .getElementById("adminPasswordInput")
        .value = "";

    document
        .getElementById("adminLoginFormView")
        .classList.remove("hidden");

    document
        .getElementById("adminPanelView")
        .classList.add("hidden");
}


// =====================================================
// REGISTER / CREATE PACKAGE
// =====================================================

async function savePackageData(event) {

    event.preventDefault();


    const tracking =
        document
            .getElementById("admTrackingNum")
            .value
            .trim()
            .toUpperCase();


    const origin =
        document
            .getElementById("admOrigin")
            .value
            .trim();


    const destination =
        document
            .getElementById("admDestination")
            .value
            .trim();


    const currentLocation =
        document
            .getElementById("admCurrentLoc")
            .value
            .trim();


    const status =
        document
            .getElementById("admStatus")
            .value;


    const estimatedDelivery =
        document
            .getElementById("admEstDelivery")
            .value
            .trim();


    if (
        !tracking ||
        !origin ||
        !destination ||
        !currentLocation
    ) {

        alert(
            "Please complete all required fields."
        );

        return;
    }


    const payload = {

        tracking_number:
            tracking,

        status:
            status,

        current_location:
            currentLocation,

        recipient_name:
            document
                .getElementById("admRecipientName")
                ?.value
                ?.trim() || "Customer",

        recipient_email:
            document
                .getElementById("admRecipientEmail")
                ?.value
                ?.trim() || "",

        origin:
            origin,

        destination:
            destination,

        estimated_delivery:
            estimatedDelivery
    };


    try {

        const response =
            await fetch(
                `${API_BASE}/api/packages`,
                {
                    method: "POST",

                    headers:
                        getAuthHeaders(),

                    body:
                        JSON.stringify(payload),

                    cache:
                        "no-store"
                }
            );


        const data =
            await response
                .json()
                .catch(() => ({}));


        if (!response.ok) {

            let error =
                data.detail ||
                data.message ||
                "Unable to create package.";

            if (Array.isArray(error)) {
                error = error
                    .map(x =>
                        x.msg ||
                        x.message ||
                        JSON.stringify(x)
                    )
                    .join(", ");
            }

            if (typeof error === "object") {
                error =
                    error.message ||
                    JSON.stringify(error);
            }

            throw new Error(error);
        }


        const created =
            data.data ||
            data.package ||
            data;


        /*
         * Keep a local fallback copy.
         */

        localPackages[tracking] = {
            tracking_number: tracking,
            origin: origin,
            destination: destination,
            current_location: currentLocation,
            status: status,
            estimated_delivery:
                estimatedDelivery
        };

        localStorage.setItem(
            "fidex_packages",
            JSON.stringify(localPackages)
        );


        const success =
            document.getElementById(
                "adminSaveSuccess"
            );

        success.innerText =
            `✅ Package ${tracking} created successfully.`;

        success.classList.remove("hidden");


        document
            .getElementById("adminUpdateForm")
            .reset();


        await loadAdminPackages();


        setTimeout(() => {
            success.classList.add("hidden");
        }, 5000);


    } catch (error) {

        console.error(
            "Create package error:",
            error
        );

        alert(
            "❌ " +
            error.message
        );
    }
}


// =====================================================
// LOAD REAL PACKAGES FROM API
// =====================================================

async function loadAdminPackages() {

    try {

        const response =
            await fetch(
                `${API_BASE}/api/admin/packages`,
                {
                    method: "GET",
                    headers:
                        getAuthHeaders(),
                    cache:
                        "no-store"
                }
            );


        const data =
            await response
                .json()
                .catch(() => ({}));


        if (!response.ok) {
            throw new Error(
                data.detail ||
                data.message ||
                "Unable to load packages."
            );
        }


        let packages =
            data.packages ||
            data.data ||
            data;


        if (!Array.isArray(packages)) {
            packages = [];
        }


        renderAdminPackages(packages);


    } catch (error) {

        console.error(
            "Package loading error:",
            error
        );

        /*
         * Fallback to locally cached packages.
         */

        renderAdminPackages(
            Object.values(localPackages)
        );
    }
}


// =====================================================
// ADMIN PACKAGE TABLE
// =====================================================

function renderAdminPackages(packages) {

    /*
     * This assumes you add:
     *
     * <tbody id="adminPackageTableBody"></tbody>
     *
     * to the admin panel.
     */

    const tbody =
        document.getElementById(
            "adminPackageTableBody"
        );


    if (!tbody) {
        return;
    }


    if (!packages.length) {

        tbody.innerHTML = `
            <tr>
                <td colspan="6"
                    class="text-center py-4 text-gray-400">
                    No packages registered.
                </td>
            </tr>
        `;

        return;
    }


    tbody.innerHTML =
        packages.map(pkg => {

            const tracking =
                pkg.tracking_number || "";

            return `
                <tr>

                    <td>
                        <strong>
                            ${escapeHtml(tracking)}
                        </strong>
                    </td>

                    <td>
                        ${escapeHtml(
                            pkg.status ||
                            "Registered"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            pkg.recipient_name ||
                            "Customer"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            pkg.current_location ||
                            "Unknown"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            pkg.destination ||
                            "Unknown"
                        )}
                    </td>

                    <td>
                        <button
                            type="button"
                            onclick="trackPackage('${escapeHtml(tracking)}')"
                            class="bg-fedex-purple text-white px-3 py-2 rounded text-xs">
                            👁 View
                        </button>
                    </td>

                </tr>
            `;

        }).join("");
}


// =====================================================
// TRACK PACKAGE
// =====================================================

async function trackPackage(tracking) {

    tracking =
        tracking
            .trim()
            .toUpperCase();


    hideError();


    try {

        const response =
            await fetch(
                `/api/track/${encodeURIComponent(tracking)}`,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Tracking number not found."
            );
        }


        const data =
            await response.json();


        packageData = data;


        renderTracking(data);


    } catch (error) {

        /*
         * Fallback for locally cached packages.
         */

        if (localPackages[tracking]) {

            packageData =
                localPackages[tracking];

            renderTracking(packageData);

            return;
        }


        showError(
            error.message ||
            "Unable to find this shipment."
        );
    }
}


// =====================================================
// TRACKING FORM
// =====================================================

document
    .getElementById("trackingForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const tracking =
                document
                    .getElementById(
                        "trackingInput"
                    )
                    .value
                    .trim()
                    .toUpperCase();


            if (!tracking) {
                return;
            }


            const button =
                document.getElementById(
                    "submitBtn"
                );


            button.disabled = true;


            try {

                await trackPackage(
                    tracking
                );

            } finally {

                button.disabled = false;
            }
        }
    );


// =====================================================
// RENDER CUSTOMER TRACKING
// =====================================================

function renderTracking(data) {

    document
        .getElementById(
            "displayTrackingNum"
        )
        .innerText =
            data.tracking_number || "N/A";


    document
        .getElementById(
            "currentLocationHeader"
        )
        .innerText =
            data.current_location ||
            data.origin ||
            "Unknown";


    document
        .getElementById(
            "currentLocationSub"
        )
        .innerText =
            data.current_location ||
            data.origin ||
            "Unknown";


    document
        .getElementById(
            "originText"
        )
        .innerText =
            "📍 " +
            (data.origin || "Origin");


    document
        .getElementById(
            "destinationText"
        )
        .innerText =
            "🏁 " +
            (data.destination || "Destination");


    document
        .getElementById(
            "estimatedDeliveryText"
        )
        .innerText =
            data.estimated_delivery ||
            "Pending";


    document
        .getElementById(
            "statusBadge"
        )
        .innerText =
            "🟢 " +
            (
                data.status ||
                "Registered"
            ).toUpperCase();


    renderProgressSteps(
        data.status
    );


    renderHistoryLogs(
        data.tracking_history ||
        data.history ||
        []
    );


    document
        .getElementById(
            "resultsCard"
        )
        .classList.remove("hidden");


    setTimeout(() => {

        document
            .getElementById(
                "resultsCard"
            )
            .scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

    }, 100);
}


// =====================================================
// PROGRESS
// =====================================================

function getStepIndex(status) {

    if (!status) {
        return 0;
    }


    const value =
        status.toLowerCase();


    if (value.includes("delivered"))
        return 6;

    if (value.includes("out for delivery"))
        return 5;

    if (value.includes("arrived"))
        return 4;

    if (value.includes("transit"))
        return 3;

    if (value.includes("departed"))
        return 2;

    if (value.includes("picked"))
        return 1;

    return 0;
}


function renderProgressSteps(status) {

    const container =
        document.getElementById(
            "progressSteps"
        );


    container.innerHTML = "";


    const active =
        getStepIndex(status);


    STEPS.forEach(
        (step, index) => {

            const past =
                index < active;

            const current =
                index === active;


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "flex items-center gap-4 relative";


            item.innerHTML = `

                <div class="
                    w-6 h-6 rounded-full
                    flex items-center justify-center
                    shrink-0 z-10
                    ${
                        past || current
                            ? "bg-fedex-purple text-white"
                            : "border-2 border-gray-300 bg-white"
                    }
                ">

                    ${
                        past
                            ? "✓"
                            : current
                                ? "●"
                                : ""
                    }

                </div>

                <span class="
                    text-sm font-bold
                    ${
                        current
                            ? "text-fedex-purple"
                            : past
                                ? "text-gray-800"
                                : "text-gray-400"
                    }
                ">
                    ${escapeHtml(step)}
                </span>
            `;


            container.appendChild(item);
        }
    );
}


// =====================================================
// HISTORY
// =====================================================

function renderHistoryLogs(history) {

    const logs =
        document.getElementById(
            "historyLogs"
        );


    logs.innerHTML = "";


    if (
        !Array.isArray(history) ||
        history.length === 0
    ) {

        logs.innerHTML =
            `<p class="text-xs text-gray-400">
                No scan events recorded.
            </p>`;

        return;
    }


    history.forEach(event => {

        const div =
            document.createElement("div");


        div.className =
            "bg-gray-50 border-l-2 border-fedex-purple p-3 rounded";


        div.innerHTML = `

            <div class="font-bold text-gray-800">
                ${escapeHtml(
                    event.status ||
                    "Update"
                )}
            </div>

            <div class="text-xs text-fedex-purple font-bold">
                ${escapeHtml(
                    event.location ||
                    ""
                )}
            </div>

            <div class="text-xs text-gray-600 mt-1">
                ${escapeHtml(
                    event.description ||
                    ""
                )}
            </div>

            <div class="text-[10px] text-gray-400 mt-1">
                ${escapeHtml(
                    event.created_at ||
                    ""
                )}
            </div>

        `;


        logs.appendChild(div);
    });
}


// =====================================================
// GEOCODING
// =====================================================

async function geocodeLocation(location) {

    if (!location) {
        return null;
    }


    const upper =
        location.toUpperCase();


    for (
        const key in FALLBACK_COORDS
    ) {

        if (
            upper.includes(key)
        ) {
            return FALLBACK_COORDS[key];
        }
    }


    try {

        const response =
            await fetch(
                `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(location)}`
            );


        const data =
            await response.json();


        if (
            Array.isArray(data) &&
            data.length
        ) {

            return [
                parseFloat(data[0].lat),
                parseFloat(data[0].lon)
            ];
        }

    } catch (error) {

        console.warn(
            "Geocoding failed:",
            error
        );
    }


    return null;
}


// =====================================================
// MAP
// =====================================================

async function initMap(pkg) {

    if (!pkg) {
        return;
    }


    const container =
        document.getElementById("map");


    if (!leafletMap) {

        leafletMap =
            L.map(container)
                .setView(
                    [20, 0],
                    2
                );


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 18,
                attribution:
                    "© OpenStreetMap contributors"
            }
        ).addTo(
            leafletMap
        );
    }


    if (animationTimer) {

        clearInterval(
            animationTimer
        );

        animationTimer = null;
    }


    mapMarkers.forEach(
        marker =>
            leafletMap.removeLayer(
                marker
            )
    );


    mapMarkers = [];


    const origin =
        await geocodeLocation(
            pkg.origin
        );


    const current =
        await geocodeLocation(
            pkg.current_location
        );


    const destination =
        await geocodeLocation(
            pkg.destination
        );


    if (
        !origin ||
        !current ||
        !destination
    ) {

        alert(
            "Could not map one or more shipment locations."
        );

        return;
    }


    const originMarker =
        L.marker(origin)
            .addTo(leafletMap)
            .bindPopup(
                `<b>Origin</b><br>${escapeHtml(pkg.origin)}`
            );


    const destinationMarker =
        L.marker(destination)
            .addTo(leafletMap)
            .bindPopup(
                `<b>Destination</b><br>${escapeHtml(pkg.destination)}`
            );


    const truckIcon =
        L.divIcon({

            html:
                `<div style="
                    font-size:26px;
                    background:white;
                    border-radius:50%;
                    width:42px;
                    height:42px;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    box-shadow:0 2px 8px rgba(0,0,0,.3);
                ">🚚</div>`,

            className:
                "shipment-truck",

            iconSize:
                [42, 42],

            iconAnchor:
                [21, 21]
        });


    movingMarker =
        L.marker(
            current,
            {
                icon:
                    truckIcon
            }
        )
        .addTo(
            leafletMap
        )
        .bindPopup(
            `<b>Current location</b><br>${escapeHtml(pkg.current_location)}`
        );


    const route =
        L.polyline(
            [
                origin,
                current,
                destination
            ],
            {
                color:
                    "#4D148C",

                weight:
                    4,

                dashArray:
                    "8 8"
            }
        )
        .addTo(
            leafletMap
        );


    mapMarkers.push(
        originMarker,
        destinationMarker,
        movingMarker,
        route
    );


    leafletMap.fitBounds(
        L.latLngBounds([
            origin,
            current,
            destination
        ]),
        {
            padding:
                [40, 40]
        }
    );


    /*
     * This is a visual route animation.
     *
     * It is NOT real GPS tracking.
     * Real GPS requires actual location data
     * from the courier/device/backend.
     */

    animateShipment(
        origin,
        current,
        destination
    );
}


// =====================================================
// SHIPMENT ANIMATION
// =====================================================

function animateShipment(
    origin,
    current,
    destination
) {

    if (!movingMarker) {
        return;
    }


    const points = [
        origin,
        current,
        destination
    ];


    let segment = 0;
    let progress = 0;


    animationTimer =
        setInterval(() => {

            if (
                segment >=
                points.length - 1
            ) {

                clearInterval(
                    animationTimer
                );

                animationTimer = null;

                return;
            }


            const start =
                points[segment];


            const end =
                points[segment + 1];


            progress += 0.01;


            if (progress >= 1) {

                progress = 0;
                segment++;
            }


            if (
                segment >=
                points.length - 1
            ) {
                return;
            }


            const lat =
                start[0] +
                (
                    end[0] -
                    start[0]
                ) *
                progress;


            const lng =
                start[1] +
                (
                    end[1] -
                    start[1]
                ) *
                progress;


            movingMarker.setLatLng(
                [lat, lng]
            );

        }, 150);
}


// =====================================================
// MAP MODAL
// =====================================================

function toggleMapModal() {

    const modal =
        document.getElementById(
            "mapModal"
        );


    modal.classList.toggle(
        "hidden"
    );


    if (
        !modal.classList.contains(
            "hidden"
        ) &&
        packageData
    ) {

        setTimeout(() => {

            if (leafletMap) {

                leafletMap.invalidateSize();
            }


            initMap(
                packageData
            );

        }, 200);
    }
}


// =====================================================
// FLAG
// =====================================================

function pkgFlag(location) {

    if (!location) {
        return "📍";
    }


    const value =
        location.toLowerCase();


    if (
        value.includes("nigeria") ||
        value.includes("lagos")
    ) {
        return "🇳🇬";
    }


    if (
        value.includes("london") ||
        value.includes("uk") ||
        value.includes("united kingdom")
    ) {
        return "🇬🇧";
    }


    if (
        value.includes("new york") ||
        value.includes("usa") ||
        value.includes("united states")
    ) {
        return "🇺🇸";
    }


    return "📍";
}

// AUTO START
// =====================================================

window.addEventListener(
    "DOMContentLoaded",
    () => {

        const email =
            localStorage.getItem(
                "adminEmail"
            );


        const password =
            localStorage.getItem(
                "adminPassword"
            );


        if (email) {

            const input =
                document.getElementById(
                    "adminEmailInput"
                );

            if (input) {
                input.value = email;
            }
        }


        if (password) {

            const input =
                document.getElementById(
                    "adminPasswordInput"
                );

            if (input) {
                input.value = password;
            }
        }
    }
);
</script>
