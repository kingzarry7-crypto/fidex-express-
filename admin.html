<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        input, button { margin: 5px 0; padding: 8px; width: 100%; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>

    <h1>Admin Panel</h1>

    <!-- 1. LOGIN FORM -->
    <div class="card" id="loginSection">
        <h2>Admin Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="handleLogin()">Login</button>
    </div>

    <!-- 2. PACKAGES DISPLAY -->
    <div class="card" id="dashboardSection">
        <h2>Packages List</h2>
        <button onclick="loadAdminPackages()">Refresh Packages</button>
        
        <table id="packageTable">
            <thead>
                <tr>
                    <th>Tracking #</th>
                    <th>Status</th>
                    <th>Details</th>
                </tr>
            </thead>
            <tbody id="packageTableBody">
                <tr><td colspan="3">Login to view packages or click refresh.</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // Set this to your backend server URL (e.g., "http://localhost:5000" or your live server URL)
        const API_BASE = "http://localhost:5000"; 

        function getAuthHeaders() {
            const token = localStorage.getItem("adminToken");
            return {
                "Content-Type": "application/json",
                "Authorization": token ? `Bearer ${token}` : ""
            };
        }

        // Handle Admin Login
        async function handleLogin() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                const res = await fetch(`${API_BASE}/api/admin/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (data.token) {
                    localStorage.setItem("adminToken", data.token);
                    alert("Login successful!");
                    loadAdminPackages(); // Auto-load packages after login
                } else {
                    alert(data.message || "Login failed");
                }
            } catch (err) {
                console.error("Login Error:", err);
                alert("Server connection failed. Is API_BASE running?");
            }
        }

        // Fetch and render packages in the HTML table
        async function loadAdminPackages() {
            const tbody = document.getElementById("packageTableBody");
            tbody.innerHTML = "<tr><td colspan='3'>Loading...</td></tr>";

            try {
                const res = await fetch(`${API_BASE}/api/admin/packages`, {
                    method: "GET",
                    headers: getAuthHeaders()
                });

                if (!res.ok) {
                    throw new Error(`HTTP error! Status: ${res.status}`);
                }

                const packages = await res.json();

                // If no packages returned
                if (!packages || packages.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='3'>No packages found.</td></tr>";
                    return;
                }

                // Render list into HTML table rows
                tbody.innerHTML = packages.map(pkg => `
                    <tr>
                        <td>${pkg.trackingNumber || pkg.id || 'N/A'}</td>
                        <td>${pkg.status || 'Pending'}</td>
                        <td>${pkg.description || 'N/A'}</td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error("Error loading packages:", err);
                tbody.innerHTML = `<tr><td colspan='3' style='color:red;'>Failed to load packages (Check console & ensure you logged in).</td></tr>`;
            }
        }

        // Run on page load
        window.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem("adminToken")) {
                loadAdminPackages();
            }
        });
    </script>
</body>
</html>
